        details: [

    // Official Heartfelt Camp Blessing
    const CAMP_FAREWELL_BLESSING = `จบแล้วน้า ค่ายนี้ พี่ๆทุกๆคนก็อยากจะขอบคุณที่วันนี้เราได้มาเจอกันน้า ก็อยากจะอวยพรน้องๆทุกคนเลยว่า ไม่ว่าสิ่งที่หวังจะใหญ่แค่ไหน ยากแค่ไหน เหนื่อยแค่ไหน ก็อยากให้รู้ไว้ว่า เราคนนี้จะไม่ยอมแพ้ จนกว่าเราจะได้อยู่ในที่ที่เรารู้สึกว่าเราอยากรู้ การเดินทางนี้อาจจะใกล้ ไกล ไม่เท่ากัน แต่อยากให้เตือนตัวเองไว้ ว่าอย่างน้อยตอนนี้เราได้เดินออกมาจามหาความฝันแล้วนะ

    // Simple Web Audio API Synthesizer
    const AudioEngine = {
      playBell() {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.35);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.35);
        } catch (e) {}
      },
      playSuccess() {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.12, ctx.currentTime + i * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.08 + 0.4);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.08);
            osc.stop(ctx.currentTime + i * 0.08 + 0.4);
          });
        } catch (e) {}
      }
    };

    // =========================================================================
    // 2. REAL-TIME STORAGE DATABASE ENGINE
    // =========================================================================

    function useRealtimeClassroomDB() {
      const readStorage = (key, fallback) => {
        try {
          const item = localStorage.getItem(key);
          return item ? JSON.parse(item) : fallback;
        } catch (e) {
          return fallback;
        }
      };

      // Active Session
      const [sessions, setSessions] = useState(() => readStorage(STORAGE_KEYS.SESSIONS, [DEFAULT_SESSION]));
      const [currentSessionId, setCurrentSessionId] = useState(() => readStorage(STORAGE_KEYS.CURRENT_SESSION_ID, DEFAULT_SESSION.id));

      const activeSession = useMemo(() => {
        return sessions.find(s => s.id === currentSessionId) || sessions[0] || DEFAULT_SESSION;
      }, [sessions, currentSessionId]);

      const getSessionKey = useCallback((baseKey) => `${currentSessionId}_${baseKey}`, [currentSessionId]);

      const [appState, setAppState] = useState(() => readStorage(getSessionKey(STORAGE_KEYS.APP_STATE), DEFAULT_APP_STATE));
      const [students, setStudents] = useState(() => readStorage(getSessionKey(STORAGE_KEYS.STUDENTS), []));
      const [phase1Answers, setPhase1Answers] = useState(() => readStorage(getSessionKey(STORAGE_KEYS.PHASE_1_ANSWERS), []));
      const [phase2Answers, setPhase2Answers] = useState(() => readStorage(getSessionKey(STORAGE_KEYS.PHASE_2_ANSWERS), []));
      const [phase3Posts, setPhase3Posts] = useState(() => readStorage(getSessionKey(STORAGE_KEYS.PHASE_3_POSTS), []));
      const [wordCloudEntries, setWordCloudEntries] = useState(() => readStorage(getSessionKey(STORAGE_KEYS.WORD_CLOUD), []));
      const [schoolPollVotes, setSchoolPollVotes] = useState(() => readStorage(getSessionKey(STORAGE_KEYS.SCHOOL_POLL), []));
      const [studentPulses, setStudentPulses] = useState(() => readStorage(STORAGE_KEYS.STUDENTS_PULSE, {}));
      const [syncPulse, setSyncPulse] = useState(Date.now());
      const [cloudStatus, setCloudStatus] = useState(() => firestoreDb ? 'connecting' : 'offline');

      const writeStorage = useCallback((key, value) => {
        try {
          localStorage.setItem(key, JSON.stringify(value));
          window.dispatchEvent(new CustomEvent('app_storage_local_change', { detail: { key, value } }));
        } catch (e) {
          console.error(e);
        }
      }, []);

      const reloadAll = useCallback(() => {
        const sKey = (k) => `${currentSessionId}_${k}`;
        setAppState(readStorage(sKey(STORAGE_KEYS.APP_STATE), DEFAULT_APP_STATE));
        setStudents(readStorage(sKey(STORAGE_KEYS.STUDENTS), []));
        setPhase1Answers(readStorage(sKey(STORAGE_KEYS.PHASE_1_ANSWERS), []));
        setPhase2Answers(readStorage(sKey(STORAGE_KEYS.PHASE_2_ANSWERS), []));
        setPhase3Posts(readStorage(sKey(STORAGE_KEYS.PHASE_3_POSTS), []));
        setWordCloudEntries(readStorage(sKey(STORAGE_KEYS.WORD_CLOUD), []));
        setSchoolPollVotes(readStorage(sKey(STORAGE_KEYS.SCHOOL_POLL), []));
        setStudentPulses(readStorage(STORAGE_KEYS.STUDENTS_PULSE, {}));
        setSyncPulse(Date.now());
      }, [currentSessionId]);

      useEffect(() => {
        reloadAll();
      }, [currentSessionId, reloadAll]);

      // Local Tab-to-Tab Synchronization (LocalStorage & BroadcastChannel fallback)
      useEffect(() => {
        const handleStorageEvent = (event) => {
          if (!event.key) {
            reloadAll();
            return;
          }
          try {
            const parsed = event.newValue ? JSON.parse(event.newValue) : null;
            const sKey = (k) => `${currentSessionId}_${k}`;

            if (event.key === STORAGE_KEYS.CURRENT_SESSION_ID) setCurrentSessionId(parsed);
            else if (event.key === STORAGE_KEYS.SESSIONS) setSessions(parsed || [DEFAULT_SESSION]);
            else if (event.key === sKey(STORAGE_KEYS.APP_STATE)) setAppState(parsed || DEFAULT_APP_STATE);
            else if (event.key === sKey(STORAGE_KEYS.STUDENTS)) setStudents(parsed || []);
            else if (event.key === sKey(STORAGE_KEYS.PHASE_1_ANSWERS)) setPhase1Answers(parsed || []);
            else if (event.key === sKey(STORAGE_KEYS.PHASE_2_ANSWERS)) setPhase2Answers(parsed || []);
            else if (event.key === sKey(STORAGE_KEYS.PHASE_3_POSTS)) setPhase3Posts(parsed || []);
            else if (event.key === sKey(STORAGE_KEYS.WORD_CLOUD)) setWordCloudEntries(parsed || []);
            else if (event.key === sKey(STORAGE_KEYS.SCHOOL_POLL)) setSchoolPollVotes(parsed || []);
            else if (event.key === STORAGE_KEYS.STUDENTS_PULSE) setStudentPulses(parsed || {});
            setSyncPulse(Date.now());
          } catch (e) {
            reloadAll();
          }
        };

        const handleLocalEvent = (event) => {
          const { key, value } = event.detail || {};
          const sKey = (k) => `${currentSessionId}_${k}`;

          if (key === STORAGE_KEYS.CURRENT_SESSION_ID) setCurrentSessionId(value);
          else if (key === STORAGE_KEYS.SESSIONS) setSessions(value);
          else if (key === sKey(STORAGE_KEYS.APP_STATE)) setAppState(value);
          else if (key === sKey(STORAGE_KEYS.STUDENTS)) setStudents(value);
          else if (key === sKey(STORAGE_KEYS.PHASE_1_ANSWERS)) setPhase1Answers(value);
          else if (key === sKey(STORAGE_KEYS.PHASE_2_ANSWERS)) setPhase2Answers(value);
          else if (key === sKey(STORAGE_KEYS.PHASE_3_POSTS)) setPhase3Posts(value);
          else if (key === sKey(STORAGE_KEYS.WORD_CLOUD)) setWordCloudEntries(value);
          else if (key === sKey(STORAGE_KEYS.SCHOOL_POLL)) setSchoolPollVotes(value);
          else if (key === STORAGE_KEYS.STUDENTS_PULSE) setStudentPulses(value);
          setSyncPulse(Date.now());
        };

        window.addEventListener('storage', handleStorageEvent);
        window.addEventListener('app_storage_local_change', handleLocalEvent);

        let channel;
        if (typeof BroadcastChannel !== 'undefined') {
          channel = new BroadcastChannel('cmu_classroom_channel');
          channel.onmessage = () => reloadAll();
        }

        const intervalId = setInterval(reloadAll, 2000);

        return () => {
          window.removeEventListener('storage', handleStorageEvent);
          window.removeEventListener('app_storage_local_change', handleLocalEvent);
          if (channel) channel.close();
          clearInterval(intervalId);
        };
      }, [currentSessionId, reloadAll]);

      // =======================================================================
      // REAL-TIME CLOUD FIRESTORE SYNCHRONIZATION (CROSS-DEVICE: PHONES & PROJECTOR)
      // =======================================================================
      useEffect(() => {
        if (!firestoreDb) {
          setCloudStatus('offline');
          return;
        }

        const roomCode = (activeSession.code || 'EDU69').toUpperCase();
        const roomRef = firestoreDb.collection('workshop_rooms').doc(roomCode);
        const sKey = (k) => `${currentSessionId}_${k}`;

        setCloudStatus('connecting');

        // 1. Room Metadata & Teacher AppState Listener
        const unsubRoom = roomRef.onSnapshot(doc => {
          setCloudStatus('online');
          if (doc.exists) {
            const data = doc.data();
            if (data.appState) {
              setAppState(prev => {
                if (JSON.stringify(prev) !== JSON.stringify(data.appState)) {
                  writeStorage(sKey(STORAGE_KEYS.APP_STATE), data.appState);
                  return data.appState;
                }
                return prev;
              });
            }
          } else {
            // First time room creation on cloud
            roomRef.set({
              roomCode: roomCode,
              sessionInfo: activeSession,
              appState: DEFAULT_APP_STATE,
              createdAt: window.firebase.firestore.FieldValue.serverTimestamp(),
              updatedAt: window.firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true }).catch(() => {});
          }
        }, err => {
          console.warn('Firestore room snapshot error:', err);
          setCloudStatus('offline');
        });

        // 2. Students Subcollection Listener
        const unsubStudents = roomRef.collection('students').onSnapshot(snap => {
          setCloudStatus('online');
          const list = [];
          snap.forEach(d => list.push(d.data()));
          setStudents(list);
          writeStorage(sKey(STORAGE_KEYS.STUDENTS), list);
        }, err => console.warn('Students cloud sync error:', err));

        // 3. Phase 1 Answers Subcollection Listener
        const unsubP1 = roomRef.collection('phase1_answers').orderBy('timestamp', 'desc').onSnapshot(snap => {
          const list = [];
          snap.forEach(d => list.push(d.data()));
          setPhase1Answers(list);
          writeStorage(sKey(STORAGE_KEYS.PHASE_1_ANSWERS), list);
        }, err => console.warn('P1 cloud sync error:', err));

        // 4. Phase 2 Answers Subcollection Listener
        const unsubP2 = roomRef.collection('phase2_answers').onSnapshot(snap => {
          const list = [];
          snap.forEach(d => list.push(d.data()));
          setPhase2Answers(list);
          writeStorage(sKey(STORAGE_KEYS.PHASE_2_ANSWERS), list);
        }, err => console.warn('P2 cloud sync error:', err));

        // 5. Phase 3 Posts Subcollection Listener
        const unsubP3 = roomRef.collection('phase3_posts').orderBy('timestamp', 'desc').onSnapshot(snap => {
          const list = [];
          snap.forEach(d => list.push(d.data()));
          setPhase3Posts(list);
          writeStorage(sKey(STORAGE_KEYS.PHASE_3_POSTS), list);
        }, err => console.warn('P3 cloud sync error:', err));

        // 6. Word Cloud Subcollection Listener
        const unsubWC = roomRef.collection('word_clouds').orderBy('timestamp', 'desc').onSnapshot(snap => {
          const list = [];
          snap.forEach(d => list.push(d.data()));
          setWordCloudEntries(list);
          writeStorage(sKey(STORAGE_KEYS.WORD_CLOUD), list);
        }, err => console.warn('WordCloud cloud sync error:', err));

        // 7. School Poll Subcollection Listener
        const unsubPoll = roomRef.collection('school_polls').onSnapshot(snap => {
          const list = [];
          snap.forEach(d => list.push(d.data()));
          setSchoolPollVotes(list);
          writeStorage(sKey(STORAGE_KEYS.SCHOOL_POLL), list);
        }, err => console.warn('Poll cloud sync error:', err));

        // 8. Pulses Subcollection Listener
        const unsubPulses = roomRef.collection('pulses').onSnapshot(snap => {
          const map = {};
          snap.forEach(d => {
            const data = d.data();
            if (data.studentId) map[data.studentId] = data;
          });
          setStudentPulses(map);
          writeStorage(STORAGE_KEYS.STUDENTS_PULSE, map);
        }, err => console.warn('Pulses cloud sync error:', err));

        return () => {
          unsubRoom();
          unsubStudents();
          unsubP1();
          unsubP2();
          unsubP3();
          unsubWC();
          unsubPoll();
          unsubPulses();
        };
      }, [currentSessionId, activeSession, writeStorage]);

      // Mutation methods (Optimistic Local UI + Background Cloud Sync)
      const updateAppState = useCallback((updates) => {
        const next = { ...appState, ...updates };
        setAppState(next);
        writeStorage(getSessionKey(STORAGE_KEYS.APP_STATE), next);

        if (firestoreDb) {
          const roomCode = (activeSession.code || 'EDU69').toUpperCase();
          firestoreDb.collection('workshop_rooms').doc(roomCode).set({
            appState: next,
            roomCode: roomCode,
            sessionInfo: activeSession,
            updatedAt: window.firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true }).catch(e => console.warn('Cloud updateAppState error:', e));
        }
      }, [appState, activeSession, getSessionKey, writeStorage]);

      const createSession = useCallback((sessionName, facilitatorName, code) => {
        const newSession = {
          id: 'session_' + Date.now(),
          name: sessionName.trim(),
          facilitatorName: facilitatorName.trim() || 'พี่สกาย',
          code: (code || 'EDU' + Math.floor(10 + Math.random() * 90)).toUpperCase(),
          date: new Date().toLocaleDateString('th-TH')
        };
        const updated = [...sessions, newSession];
        setSessions(updated);
        setCurrentSessionId(newSession.id);
        writeStorage(STORAGE_KEYS.SESSIONS, updated);
        writeStorage(STORAGE_KEYS.CURRENT_SESSION_ID, newSession.id);

        if (firestoreDb) {
          firestoreDb.collection('workshop_rooms').doc(newSession.code).set({
            roomCode: newSession.code,
            sessionInfo: newSession,
            appState: DEFAULT_APP_STATE,
            createdAt: window.firebase.firestore.FieldValue.serverTimestamp(),
            updatedAt: window.firebase.firestore.FieldValue.serverTimestamp()
          }).catch(e => console.warn('Cloud createSession error:', e));
        }
        return newSession;
      }, [sessions, writeStorage]);

      const updateSessionFacilitator = useCallback((name) => {
        const updated = sessions.map(s => s.id === currentSessionId ? { ...s, facilitatorName: name } : s);
        setSessions(updated);
        writeStorage(STORAGE_KEYS.SESSIONS, updated);

        if (firestoreDb) {
          const roomCode = (activeSession.code || 'EDU69').toUpperCase();
          firestoreDb.collection('workshop_rooms').doc(roomCode).set({
            sessionInfo: { ...activeSession, facilitatorName: name },
            updatedAt: window.firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true }).catch(e => console.warn('Cloud updateSessionFacilitator error:', e));
        }
      }, [sessions, currentSessionId, activeSession, writeStorage]);

      const registerStudent = useCallback((name, zone, grade, kwl) => {
        const studentId = 'std_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
        const newStudent = {
          id: studentId,
          name: name.trim(),
          zone: Number(zone),
          grade: grade || 'ม.6',
          kwl: kwl || { whatIKnow: '', whatIWantToKnow: '', whatIHaveLearned: '' }
        };
        const updated = [...students.filter(s => s.id !== studentId), newStudent];
        setStudents(updated);
        writeStorage(getSessionKey(STORAGE_KEYS.STUDENTS), updated);
        localStorage.setItem(STORAGE_KEYS.CURRENT_STUDENT_SESSION, JSON.stringify(newStudent));

        if (firestoreDb) {
          const roomCode = (activeSession.code || 'EDU69').toUpperCase();
          firestoreDb.collection('workshop_rooms').doc(roomCode).collection('students').doc(newStudent.id).set(newStudent)
            .catch(e => console.warn('Cloud registerStudent error:', e));
        }

        AudioEngine.playSuccess();
        return newStudent;
      }, [students, activeSession, getSessionKey, writeStorage]);

      const updateStudentKwl = useCallback((studentId, kwlUpdates) => {
        const updated = students.map(s => {
          if (s.id === studentId) {
            return { ...s, kwl: { ...(s.kwl || {}), ...kwlUpdates } };
          }
          return s;
        });
        setStudents(updated);
        writeStorage(getSessionKey(STORAGE_KEYS.STUDENTS), updated);

        try {
          const current = JSON.parse(localStorage.getItem(STORAGE_KEYS.CURRENT_STUDENT_SESSION));
          if (current?.id === studentId) {
            localStorage.setItem(STORAGE_KEYS.CURRENT_STUDENT_SESSION, JSON.stringify({
              ...current,
              kwl: { ...(current.kwl || {}), ...kwlUpdates }
            }));
          }
        } catch (e) {}

        if (firestoreDb) {
          const roomCode = (activeSession.code || 'EDU69').toUpperCase();
          firestoreDb.collection('workshop_rooms').doc(roomCode).collection('students').doc(studentId).set({
            kwl: kwlUpdates
          }, { merge: true }).catch(e => console.warn('Cloud updateStudentKwl error:', e));
        }

        AudioEngine.playSuccess();
      }, [students, activeSession, getSessionKey, writeStorage]);

      const removeStudent = useCallback((studentId) => {
        const updatedStudents = students.filter(s => s.id !== studentId);
        setStudents(updatedStudents);
        writeStorage(getSessionKey(STORAGE_KEYS.STUDENTS), updatedStudents);

        // Clean up phase 1 answers by this student
        const updatedP1 = phase1Answers.filter(a => a.student_id !== studentId);
        if (updatedP1.length !== phase1Answers.length) {
          setPhase1Answers(updatedP1);
          writeStorage(getSessionKey(STORAGE_KEYS.PHASE_1_ANSWERS), updatedP1);
        }

        // Clean up phase 2 answers by this student
        const updatedP2 = phase2Answers.filter(a => a.student_id !== studentId);
        if (updatedP2.length !== phase2Answers.length) {
          setPhase2Answers(updatedP2);
          writeStorage(getSessionKey(STORAGE_KEYS.PHASE_2_ANSWERS), updatedP2);
        }

        // Clean up phase 3 posts by this student
        const updatedPosts = phase3Posts.filter(p => p.student_id !== studentId);
        if (updatedPosts.length !== phase3Posts.length) {
          setPhase3Posts(updatedPosts);
          writeStorage(getSessionKey(STORAGE_KEYS.PHASE_3_POSTS), updatedPosts);
        }

        // Clear local session if matching
        try {
          const current = JSON.parse(localStorage.getItem(STORAGE_KEYS.CURRENT_STUDENT_SESSION));
          if (current?.id === studentId) {
            localStorage.removeItem(STORAGE_KEYS.CURRENT_STUDENT_SESSION);
          }
        } catch (e) {}

        if (firestoreDb) {
          const roomCode = (activeSession.code || 'EDU69').toUpperCase();
          firestoreDb.collection('workshop_rooms').doc(roomCode).collection('students').doc(studentId).delete()
            .catch(e => console.warn('Cloud removeStudent error:', e));
        }

        AudioEngine.playPop();
      }, [students, phase1Answers, phase2Answers, phase3Posts, activeSession, getSessionKey, writeStorage]);

      const submitPhase1Answer = useCallback((text, type, student) => {
        const newAnswer = {
          id: 'p1_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
          text: text.trim(),
          type: type,
          student_id: student?.id || 'unknown',
          student_name: student?.name || 'นิรนาม',
          zone: student?.zone || 1,
          timestamp: Date.now()
        };
        const updated = [newAnswer, ...phase1Answers.filter(a => a.id !== newAnswer.id)];
        setPhase1Answers(updated);
        writeStorage(getSessionKey(STORAGE_KEYS.PHASE_1_ANSWERS), updated);

        if (firestoreDb) {
          const roomCode = (activeSession.code || 'EDU69').toUpperCase();
          firestoreDb.collection('workshop_rooms').doc(roomCode).collection('phase1_answers').doc(newAnswer.id).set(newAnswer)
            .catch(e => console.warn('Cloud submitPhase1Answer error:', e));
        }

        AudioEngine.playBell();
      }, [phase1Answers, activeSession, getSessionKey, writeStorage]);

      const submitSchoolPoll = useCallback((choice, student) => {
        if (!student) return;
        const newVote = {
          id: 'poll_' + student.id,
          student_id: student.id,
          student_name: student.name,
          zone: student.zone,
          choice: choice,
          timestamp: Date.now()
        };
        const updated = [...schoolPollVotes.filter(v => v.student_id !== student.id), newVote];
        setSchoolPollVotes(updated);
        writeStorage(getSessionKey(STORAGE_KEYS.SCHOOL_POLL), updated);

        if (firestoreDb) {
          const roomCode = (activeSession.code || 'EDU69').toUpperCase();
          firestoreDb.collection('workshop_rooms').doc(roomCode).collection('school_polls').doc(student.id).set(newVote)
            .catch(e => console.warn('Cloud submitSchoolPoll error:', e));
        }

        AudioEngine.playBell();
      }, [schoolPollVotes, activeSession, getSessionKey, writeStorage]);

      const submitPhase2Vote = useCallback((choice, questionId, student) => {
        if (!student) return;
        const voteDocId = `${student.id}_${questionId}`;
        const newVote = {
          id: voteDocId,
          student_id: student.id,
          student_name: student.name,
          question_id: questionId,
          choice: choice,
          timestamp: Date.now()
        };
        const updated = [...phase2Answers.filter(item => !(item.student_id === student.id && item.question_id === questionId)), newVote];
        setPhase2Answers(updated);
        writeStorage(getSessionKey(STORAGE_KEYS.PHASE_2_ANSWERS), updated);

        if (firestoreDb) {
          const roomCode = (activeSession.code || 'EDU69').toUpperCase();
          firestoreDb.collection('workshop_rooms').doc(roomCode).collection('phase2_answers').doc(voteDocId).set(newVote)
            .catch(e => console.warn('Cloud submitPhase2Vote error:', e));
        }

        AudioEngine.playBell();
      }, [phase2Answers, activeSession, getSessionKey, writeStorage]);

      const submitPhase3Post = useCallback((problem, cause, solution, role, student) => {
        if (!student) return;
        const newPost = {
          id: 'p3_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
          student_id: student.id,
          student_name: student.name,
          zone: student.zone,
          role: role || 'ตัวแทนกลุ่ม',
          problem: problem.trim(),
          cause: cause.trim(),
          solution: solution.trim(),
          likes: 0,
          liked_by: [],
          is_spotlight: false,
          timestamp: Date.now()
        };
        const updated = [newPost, ...phase3Posts.filter(p => p.id !== newPost.id)];
        setPhase3Posts(updated);
        writeStorage(getSessionKey(STORAGE_KEYS.PHASE_3_POSTS), updated);

        if (firestoreDb) {
          const roomCode = (activeSession.code || 'EDU69').toUpperCase();
          firestoreDb.collection('workshop_rooms').doc(roomCode).collection('phase3_posts').doc(newPost.id).set(newPost)
            .catch(e => console.warn('Cloud submitPhase3Post error:', e));
        }

        AudioEngine.playSuccess();
      }, [phase3Posts, activeSession, getSessionKey, writeStorage]);

      const toggleLikePhase3Post = useCallback((postId, studentId) => {
        let targetPost = null;
        const updated = phase3Posts.map(post => {
          if (post.id === postId) {
            const hasLiked = post.liked_by?.includes(studentId);
            const liked_by = hasLiked
              ? post.liked_by.filter(id => id !== studentId)
              : [...(post.liked_by || []), studentId];
            targetPost = { ...post, likes: liked_by.length, liked_by };
            return targetPost;
          }
          return post;
        });
        setPhase3Posts(updated);
        writeStorage(getSessionKey(STORAGE_KEYS.PHASE_3_POSTS), updated);

        if (firestoreDb && targetPost) {
          const roomCode = (activeSession.code || 'EDU69').toUpperCase();
          firestoreDb.collection('workshop_rooms').doc(roomCode).collection('phase3_posts').doc(postId).set({
            likes: targetPost.likes,
            liked_by: targetPost.liked_by
          }, { merge: true }).catch(e => console.warn('Cloud like error:', e));
        }

        AudioEngine.playBell();
      }, [phase3Posts, activeSession, getSessionKey, writeStorage]);

      const toggleSpotlightPost = useCallback((postId) => {
        let nextSpotlight = false;
        const updated = phase3Posts.map(post => {
          if (post.id === postId) {
            nextSpotlight = !post.is_spotlight;
            return { ...post, is_spotlight: nextSpotlight };
          }
          return post;
        });
        setPhase3Posts(updated);
        writeStorage(getSessionKey(STORAGE_KEYS.PHASE_3_POSTS), updated);

        if (firestoreDb) {
          const roomCode = (activeSession.code || 'EDU69').toUpperCase();
          firestoreDb.collection('workshop_rooms').doc(roomCode).collection('phase3_posts').doc(postId).set({
            is_spotlight: nextSpotlight
          }, { merge: true }).catch(e => console.warn('Cloud spotlight error:', e));
        }
      }, [phase3Posts, activeSession, getSessionKey, writeStorage]);

      const submitWordCloud = useCallback((w1, w2, w3, category, student) => {
        const words = [w1, w2, w3].map(w => w?.trim()).filter(Boolean);
        if (words.length === 0) return;

        const newEntry = {
          id: 'wc_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
          student_id: student?.id || 'unknown',
          student_name: student?.name || 'นิรนาม',
          words: words,
          category: category || 'today',
          timestamp: Date.now()
        };
        const updated = [newEntry, ...wordCloudEntries.filter(e => e.id !== newEntry.id)];
        setWordCloudEntries(updated);
        writeStorage(getSessionKey(STORAGE_KEYS.WORD_CLOUD), updated);

        if (firestoreDb) {
          const roomCode = (activeSession.code || 'EDU69').toUpperCase();
          firestoreDb.collection('workshop_rooms').doc(roomCode).collection('word_clouds').doc(newEntry.id).set(newEntry)
            .catch(e => console.warn('Cloud word cloud error:', e));
        }

        AudioEngine.playSuccess();
      }, [wordCloudEntries, activeSession, getSessionKey, writeStorage]);

      const triggerFacilitatorRecall = useCallback(() => {
        const recallSignal = {
          active: true,
          timestamp: Date.now(),
          sessionId: currentSessionId
        };
        writeStorage(STORAGE_KEYS.RECALL_SIGNAL, recallSignal);

        if (firestoreDb) {
          const roomCode = (activeSession.code || 'EDU69').toUpperCase();
          firestoreDb.collection('workshop_rooms').doc(roomCode).set({
            recallSignal: recallSignal,
            updatedAt: window.firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true }).catch(e => console.warn('Cloud recall signal error:', e));
        }

        AudioEngine.playBell();
      }, [currentSessionId, activeSession, writeStorage]);

      const sendStudentPulse = useCallback((student, currentScreen, extra = {}) => {
        if (!student) return;
        const pulseData = {
          studentId: student.id,
          name: student.name,
          zone: student.zone,
          currentScreen: currentScreen || 'workshop',
          phase: appState.current_phase,
          isDoneKwlL: Boolean(student.kwl?.whatIHaveLearned),
          lastActive: Date.now(),
          ...extra
        };

        try {
          const existing = readStorage(STORAGE_KEYS.STUDENTS_PULSE, {});
          existing[student.id] = pulseData;
          writeStorage(STORAGE_KEYS.STUDENTS_PULSE, existing);
        } catch (e) {}

        if (firestoreDb) {
          const roomCode = (activeSession.code || 'EDU69').toUpperCase();
          firestoreDb.collection('workshop_rooms').doc(roomCode).collection('pulses').doc(student.id).set(pulseData, { merge: true })
            .catch(() => {});
        }
      }, [appState.current_phase, activeSession, writeStorage]);

      const resetSessionData = useCallback(() => {
        const sKey = (k) => `${currentSessionId}_${k}`;
        setAppState(DEFAULT_APP_STATE);
        setStudents([]);
        setPhase1Answers([]);
        setPhase2Answers([]);
        setPhase3Posts([]);
        setWordCloudEntries([]);
        setSchoolPollVotes([]);
        setStudentPulses({});

        localStorage.removeItem(sKey(STORAGE_KEYS.APP_STATE));
        localStorage.removeItem(sKey(STORAGE_KEYS.STUDENTS));
        localStorage.removeItem(sKey(STORAGE_KEYS.PHASE_1_ANSWERS));
        localStorage.removeItem(sKey(STORAGE_KEYS.PHASE_2_ANSWERS));
        localStorage.removeItem(sKey(STORAGE_KEYS.PHASE_3_POSTS));
        localStorage.removeItem(sKey(STORAGE_KEYS.WORD_CLOUD));
        localStorage.removeItem(sKey(STORAGE_KEYS.SCHOOL_POLL));
        localStorage.removeItem(STORAGE_KEYS.STUDENTS_PULSE);

        if (firestoreDb) {
          const roomCode = (activeSession.code || 'EDU69').toUpperCase();
          const roomRef = firestoreDb.collection('workshop_rooms').doc(roomCode);
          roomRef.set({
            appState: DEFAULT_APP_STATE,
            updatedAt: window.firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true }).catch(() => {});

          ['students', 'phase1_answers', 'phase2_answers', 'phase3_posts', 'word_clouds', 'school_polls', 'pulses'].forEach(col => {
            roomRef.collection(col).get().then(snap => {
              const batch = firestoreDb.batch();
              snap.forEach(doc => batch.delete(doc.ref));
              return batch.commit();
            }).catch(() => {});
          });
        }

        reloadAll();
      }, [currentSessionId, activeSession, reloadAll]);

      const exportSessionDataAsJson = useCallback(() => {
        const data = {
          session: activeSession,
          appState,
          students,
          phase1Answers,
          phase2Answers,
          phase3Posts,
          wordCloudEntries,
          schoolPollVotes,
          exportedAt: new Date().toISOString()
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Workshop_EDU_${activeSession.code}_${Date.now()}.json`;
        a.click();
        URL.revokeObjectURL(url);
      }, [activeSession, appState, students, phase1Answers, phase2Answers, phase3Posts, wordCloudEntries, schoolPollVotes]);

      return {
        sessions,
        setSessions,
        cloudStatus,
        activeSession,
        currentSessionId,
        setCurrentSessionId,
        createSession,
        updateSessionFacilitator,
        appState,
        updateAppState,
        students,
        registerStudent,
        removeStudent,
        updateStudentKwl,
        phase1Answers,
        submitPhase1Answer,
        phase2Answers,
        submitPhase2Vote,
        phase3Posts,
        submitPhase3Post,
        toggleLikePhase3Post,
        toggleSpotlightPost,
        wordCloudEntries,
        submitWordCloud,
        schoolPollVotes,
        submitSchoolPoll,
        studentPulses,
        sendStudentPulse,
        triggerFacilitatorRecall,
        resetSessionData,
        exportSessionDataAsJson,
        syncPulse
      };
    }

            if (currentPhase === 1 && (appState.phase_1_step || 1) < 4) {
              updateAppState({ phase_1_step: (appState.phase_1_step || 1) + 1 });

              updateAppState({ current_phase: currentPhase + 1 });

            if (currentPhase === 1 && (appState.phase_1_step || 1) > 1) {
              updateAppState({ phase_1_step: (appState.phase_1_step || 1) - 1 });
            } else if (currentPhase === 4 && (appState.phase_4_step || 1) > 1) {
              updateAppState({ phase_4_step: (appState.phase_4_step || 1) - 1 });

            toggleFullscreen();

        return () => window.removeEventListener('keydown', handleKeyDown);

          setEditFacilitator(false);
        }
      };

      const pulseEntries = Object.values(studentPulses || {});
      const now = Date.now();
      const onlineNowCount = pulseEntries.filter(p => now - (p.lastActive || 0) < 30000).length || students.length;
      const inLessonPlanCount = pulseEntries.filter(p => p.currentScreen === 'lesson_plan' && now - (p.lastActive || 0) < 30000).length;
      const completedLCount = students.filter(s => Boolean(s.kwl?.whatIHaveLearned)).length;

      // Real-time student distribution breakdown across activities (ITEM #4)
      const activityDistribution = useMemo(() => {
        const counts = {
          lobby: 0,
          act1: 0,
          act2Duties: 0,
          act2Schooltopia: 0,
          lessonPlan: 0,
          phase4: 0,
          finished: 0,
          offline: 0
        };

        students.forEach(student => {
          const pulse = studentPulses[student.id];
          const isLive = pulse && (now - (pulse.lastActive || 0) < 30000);
          if (!isLive) {
            counts.offline++;
            return;
          }
          if (pulse.currentScreen === 'lesson_plan') {
            counts.lessonPlan++;
          } else if (pulse.currentScreen === 'phase_4_finished') {
            counts.finished++;
          } else if (pulse.currentScreen?.startsWith('phase_4')) {
            counts.phase4++;
          } else if (pulse.currentScreen === 'phase_3') {
            counts.act2Schooltopia++;
          } else if (pulse.currentScreen === 'phase_2') {
            counts.act2Duties++;
          } else if (pulse.currentScreen === 'phase_1') {
            counts.act1++;
          } else {
            counts.lobby++;
          }
        });
        return counts;
      }, [students, studentPulses, now]);

                <span className="text-base font-heading font-bold text-amber-400 mt-1">{activityDistribution.act1} คน</span>

                <span className="text-base font-heading font-bold text-emerald-400 mt-1">{activityDistribution.act2Duties} คน</span>

                    🗑️ รีเซ็ตห้อง

            {/* Stepper Tabs */}
            <div className="pt-5">

    // --- Admin Phase 2: Teacher's Duties (With Centered Portal Reveal Modal - Fix #1) ---
    function AdminPhase2({ db, isPresenter, onSpotlight }) {
      const { appState, students, phase2Answers, updateAppState } = db;
      const questionId = appState.phase_2_question || 1;
      const isRevealed = appState.phase_2_revealed || false;
      const currentDuty = PHASE_2_CURATED_DUTIES.find(q => q.id === questionId) || PHASE_2_CURATED_DUTIES[0];

      const totalStudents = students.length || 1;
      const votesForCurrent = phase2Answers.filter(a => a.question_id === questionId);
      const answeredCount = votesForCurrent.length;
      const answerPct = Math.min(100, Math.round((answeredCount / totalStudents) * 100));

      const yesVotes = votesForCurrent.filter(a => a.choice === 'yes').length;
      const noVotes = votesForCurrent.filter(a => a.choice === 'no').length;
      const yesPct = answeredCount > 0 ? Math.round((yesVotes / answeredCount) * 100) : 0;
      const noPct = answeredCount > 0 ? Math.round((noVotes / answeredCount) * 100) : 0;

      const handlePrev = () => {
        if (questionId > 1) updateAppState({ phase_2_question: questionId - 1 });
      };

      const handleNext = () => {
        if (questionId < PHASE_2_CURATED_DUTIES.length) updateAppState({ phase_2_question: questionId + 1 });
      };

      const toggleReveal = () => {
        const nextState = !isRevealed;
        updateAppState({ phase_2_revealed: nextState });
        if (nextState && typeof confetti === 'function') {
          confetti({ particleCount: 160, spread: 85, origin: { y: 0.5 } });
        }
        AudioEngine.playSuccess();
      };

      return (
        <div className="space-y-6 view-transition">

                  onClick={handlePrev}
                  disabled={questionId === 1}
                  className="px-3 py-2 text-xs font-semibold rounded-xl bg-slate-100 hover:bg-slate-200 disabled:opacity-40 cursor-pointer"
                >
                  ⬅️ ข้อก่อน
                </button>
                <button
                  onClick={handleNext}
                  disabled={questionId === PHASE_2_CURATED_DUTIES.length}
                  className="px-3 py-2 text-xs font-semibold rounded-xl bg-slate-100 hover:bg-slate-200 disabled:opacity-40 cursor-pointer"
                >

                  onClick={toggleReveal}
                  className={`px-5 py-2.5 rounded-xl font-heading font-bold text-xs sm:text-sm text-white shadow-md transition cursor-pointer ${

                  }`}

                  ไป Activity 2 (Schooltopia) ➡️
                </button>
              </div>
            </div>
          )}

        } catch (e) {
          return null;
        }

        return students.find(s => s.id === currentStudent.id) || currentStudent;

      // Listen for navbar event trigger
      useEffect(() => {
        const handleResetEvent = () => setShowResetModal(true);
        window.addEventListener('cmu-force-student-reset', handleResetEvent);
        return () => window.removeEventListener('cmu-force-student-reset', handleResetEvent);
      }, []);

      // Report Live Pulse Heartbeat with granular activity tagging (ITEM #4)
      useEffect(() => {
        if (!matchedStudent) return;

        let screenTag = 'lobby';
        let activityLabel = '🎒 Lobby (รอเริ่มกิจกรรม)';
        if (currentPhase === 0) {
          screenTag = matchedStudent.kwl?.whatIKnow ? 'lobby_waiting' : 'kwl_part1';
          activityLabel = matchedStudent.kwl?.whatIKnow ? '🎒 Lobby (รอเริ่มกิจกรรม)' : '📋 กรอก KWL (K & W)';
        } else if (currentPhase === 1) {
          screenTag = 'phase_1';
          activityLabel = '💡 Act 1: ครูคือใคร (Sage vs Guide)';
        } else if (currentPhase === 2) {
          screenTag = 'phase_2';
          activityLabel = '📋 Act 1.2: งานครู 8 มิติ';
        } else if (currentPhase === 3) {
          screenTag = 'phase_3';
          activityLabel = '🏫 Act 2: Schooltopia (4 โซน)';
        } else if (currentPhase === 4) {
          const p4Step = appState.phase_4_step || 1;
          if (p4Step === 1) {
            screenTag = 'phase_4_kwl_l';
            activityLabel = '🌱 KWL ช่อง L (สรุปการเรียนรู้)';

            screenTag = 'phase_4_wordcloud';

            activityLabel,
            currentPhase,
            isDoneKwlL: Boolean(matchedStudent.kwl?.whatIHaveLearned)

                <span>🔄</span>
                <span>{matchedStudent ? 'บังคับเริ่มใหม่' : 'เริ่มใหม่'}</span>

            {/* REVISED CORE LOGIC (ITEM #3):

    // --- Student Phase 0: Room Code Verification + Register + KWL (Fix #4) ---
    function StudentPhase0({ db, currentStudent, onRegistered, onRequestReset }) {
      const { activeSession, sessions } = db;
      const urlRoom = new URLSearchParams(window.location.search).get('room') || '';

      const [step, setStep] = useState(urlRoom ? 1 : 0); // 0: Enter Room Code, 1: Name & Zone, 2: KWL Part 1
      const [inputRoomCode, setInputRoomCode] = useState(urlRoom || '');
      const [roomError, setRoomError] = useState('');

      // Auto-resolve url room parameter via Firestore if needed
      useEffect(() => {
        if (urlRoom) {
          const cleanCode = urlRoom.trim().toUpperCase();
          const found = sessions.find(s => s.code.toUpperCase() === cleanCode);
          if (found) {
            if (found.id !== db.currentSessionId) db.setCurrentSessionId(found.id);
            setStep(1);
          } else if (firestoreDb) {
            firestoreDb.collection('workshop_rooms').doc(cleanCode).get().then(snap => {
              if (snap.exists) {
                const data = snap.data();
                const sess = data.sessionInfo || {
                  id: 'session_' + cleanCode,
                  code: cleanCode,
                  name: 'ห้องเรียน ' + cleanCode,
                  facilitatorName: 'พี่สกาย',
                  date: new Date().toLocaleDateString('th-TH')
                };
                if (db.setSessions) {
                  db.setSessions(prev => [...prev.filter(s => s.code !== cleanCode), sess]);
                }
                db.setCurrentSessionId(sess.id);
                setStep(1);
              }
            }).catch(() => {});
          }
        }
      }, [urlRoom, sessions, db]);

      const [nickname, setNickname] = useState('');
      const [selectedZone, setSelectedZone] = useState(1);
      const [grade, setGrade] = useState('ม.6');

      const [selectedKChips, setSelectedKChips] = useState([]);
      const [whatIKnowCustom, setWhatIKnowCustom] = useState('');
      const [selectedWChips, setSelectedWChips] = useState([]);
      const [whatIWantToKnowCustom, setWhatIWantToKnowCustom] = useState('');
      const [error, setError] = useState('');

      const toggleKChip = (chip) => {
        setSelectedKChips(prev => 
          prev.includes(chip) ? prev.filter(c => c !== chip) : [...prev, chip]
        );
      };

      const toggleWChip = (chip) => {
        setSelectedWChips(prev => 
          prev.includes(chip) ? prev.filter(c => c !== chip) : [...prev, chip]
        );
      };

      // Handle Step 0: Check Room Code with Firestore Fallback
      const handleRoomCodeSubmit = async (e) => {
        e.preventDefault();
        const cleanCode = inputRoomCode.trim().toUpperCase();
        if (!cleanCode) {
          setRoomError('กรุณากรอกรหัสห้องเรียน');
          return;
        }

        const foundSession = sessions.find(s => s.code.toUpperCase() === cleanCode);
        if (foundSession) {
          setRoomError('');
          if (foundSession.id !== db.currentSessionId) {
            db.setCurrentSessionId(foundSession.id);
          }
          setStep(1); // Proceed to Registration
          return;
        }

        // Check remote Firestore if not found in local browser session cache
        if (firestoreDb) {
          try {
            const snap = await firestoreDb.collection('workshop_rooms').doc(cleanCode).get();
            if (snap.exists) {
              const data = snap.data();
              const sess = data.sessionInfo || {
                id: 'session_' + cleanCode,
                code: cleanCode,
                name: 'ห้องเรียน ' + cleanCode,
                facilitatorName: 'พี่สกาย',
                date: new Date().toLocaleDateString('th-TH')
              };
              if (db.setSessions) {
                db.setSessions(prev => [...prev.filter(s => s.code !== cleanCode), sess]);
              }
              db.setCurrentSessionId(sess.id);
              setRoomError('');
              setStep(1);
              return;
            }
          } catch (err) {
            console.warn('Firestore room lookup error:', err);
          }
        }

        setRoomError(`ไม่พบห้องรหัส "${cleanCode}" กรุณาตรวจสอบรหัสบนจอโปรเจกเตอร์นะจ๊ะ`);
      };

      const handleStep1Submit = (e) => {
        e.preventDefault();
        if (!nickname.trim()) {
          setError('กรุณากรอกชื่อเล่นของน้องก่อนนะ');
          return;
        }
        setError('');
        setStep(2);
      };

      const handleKwlSubmit = (e) => {
        e.preventDefault();
        const combinedK = [...selectedKChips, whatIKnowCustom.trim()].filter(Boolean).join('\n• ');
        const combinedW = [...selectedWChips, whatIWantToKnowCustom.trim()].filter(Boolean).join('\n• ');

        if (!combinedK || !combinedW) {
          setError('กรุณาเลือกหรือพิมพ์ตอบทั้งช่อง K และช่อง W อย่างน้อย 1 ข้อนะจ๊ะ');
          return;
        }

        setError('');
        const kwl = {
          whatIKnow: combinedK,
          whatIWantToKnow: combinedW,
          whatIHaveLearned: ''
        };
        const student = db.registerStudent(nickname, selectedZone, grade, kwl);
        onRegistered(student);
      };

      // Already registered -> WAITING SCREEN
      if (currentStudent) {
        const studentZone = ZONES.find(z => z.id === currentStudent.zone) || ZONES[0];

        return (
          <div className="glass-card rounded-3xl p-6 sm:p-8 border-2 border-sky-200 bg-white shadow-lg text-center view-transition">
            <div className="relative w-24 h-24 mx-auto my-6 flex items-center justify-center">
              <div className="absolute inset-0 rounded-full bg-sky-400/20 animate-ping"></div>
              <div className="absolute inset-2 rounded-full bg-sky-500/30 animate-pulse"></div>
              <div className="w-16 h-16 rounded-full bg-gradient-to-tr from-sky-600 to-indigo-600 text-white flex items-center justify-center text-2xl shadow-md">
                📡
              </div>
            </div>

            <span className="inline-block px-3 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-800 border border-amber-300 mb-2">
              ทำใบงาน KWL เรียบร้อยแล้ว ✓
            </span>

            <h3 className="text-xl sm:text-2xl font-heading font-extrabold text-slate-900 leading-snug">
              กำลังรอสัญญาณจาก{activeSession.facilitatorName}...
            </h3>

            <p className="text-sm text-slate-600 mt-2 leading-relaxed">
              ยินดีต้อนรับน้อง <strong className="text-sky-700">{currentStudent.name}</strong> ประจำ {studentZone.badge}
            </p>

            <div className="mt-6 p-4 rounded-2xl bg-sky-50/70 border border-sky-100 text-xs text-sky-950 text-left space-y-2">
              <div className="font-bold flex items-center gap-1.5 text-sky-900">
                <span>✨ ข้อมูลใบงาน KWL ของน้อง:</span>
              </div>
              <p><strong>What I Know:</strong> {currentStudent.kwl?.whatIKnow}</p>
              <p><strong>What I Want to Know:</strong> {currentStudent.kwl?.whatIWantToKnow}</p>
              <p className="text-slate-400 italic pt-1">
                *ช่อง What I Have Learned จะปลดล็อคให้ตอบท้ายค่ายหลังเสร็จกิจกรรม
              </p>
            </div>

            <div className="mt-4 pt-3 border-t border-slate-100 flex flex-col gap-2">
              <button
                type="button"
                onClick={onRequestReset}
                className="w-full py-2.5 px-4 rounded-xl text-xs font-bold text-rose-600 hover:text-rose-700 bg-rose-50 hover:bg-rose-100 border border-rose-200 transition cursor-pointer flex items-center justify-center gap-1.5 active:scale-95 shadow-2xs"
              >
                <span>🔄</span>
                <span>พิมพ์ชื่อผิด หรือต้องการลงทะเบียนใหม่? คลิกที่นี่</span>
              </button>
            </div>
          </div>
        );
      }

      // STEP 0: ENTER ROOM CODE SCREEN (RECOMMENDATION 4)
      if (step === 0) {
        return (
          <div className="glass-card rounded-3xl p-6 sm:p-8 border-2 border-sky-300 bg-white shadow-xl view-transition text-center space-y-6">
            <div className="w-20 h-20 mx-auto rounded-3xl bg-gradient-to-tr from-sky-500 via-indigo-500 to-purple-600 text-white flex items-center justify-center text-4xl shadow-md animate-float">
              🎒
            </div>

            <div>
              <span className="px-3 py-1 rounded-full text-xs font-bold bg-sky-100 text-sky-800 inline-block mb-1">
                The Teaching Profession Workshop
              </span>
              <h2 className="text-2xl font-heading font-extrabold text-slate-900 mt-1">
                เข้าร่วมห้องเรียน
              </h2>
              <p className="text-xs text-slate-500 mt-1">
                กรอกรหัสห้องเรียนที่แสดงบนจอโปรเจกเตอร์เพื่อเริ่มต้น
              </p>
            </div>

            <form onSubmit={handleRoomCodeSubmit} className="space-y-4">
              <div>
                <input
                  type="text"
                  placeholder="เช่น EDU69"
                  value={inputRoomCode}
                  onChange={e => setInputRoomCode(e.target.value.toUpperCase())}
                  maxLength={10}
                  className="w-full text-center text-3xl font-code font-black tracking-widest px-4 py-3.5 rounded-2xl border-2 border-slate-300 focus:border-sky-500 focus:ring-4 focus:ring-sky-100 uppercase bg-slate-50 outline-hidden room-code-input transition shadow-inner"
                />
                {roomError && <p className="text-xs text-rose-500 font-bold mt-2">{roomError}</p>}
              </div>

              <button
                type="submit"
                className="w-full py-4 rounded-2xl font-heading font-bold text-base text-white bg-gradient-to-r from-sky-600 via-indigo-600 to-purple-600 hover:from-sky-700 shadow-lg shadow-sky-200 active:scale-95 transition cursor-pointer"
              >
                เข้าสู่ห้องเรียน (Join) 🚀
              </button>
            </form>
          </div>
        );
      }

      // STEP 1: REGISTRATION FORM
      if (step === 1) {
        return (
          <div className="glass-card rounded-3xl p-6 sm:p-8 border-2 border-sky-200 bg-white shadow-lg view-transition">
            <div className="text-center mb-6">
              <div className="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-tr from-sky-500 via-indigo-500 to-purple-600 flex items-center justify-center text-white text-3xl shadow-md mb-3">
                💡
              </div>
              <h2 className="text-xl sm:text-2xl font-heading font-extrabold text-slate-900">
                ข้อมูลส่วนตัวนักเรียน
              </h2>
              <p className="text-xs text-slate-500 mt-1">
                ห้อง {activeSession.code} • {activeSession.name}
              </p>
            </div>

            <form onSubmit={handleStep1Submit} className="space-y-4">
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1.5">
                  ชื่อเล่นของน้อง <span className="text-rose-500">*</span>
                </label>
                <input
                  type="text"
                  value={nickname}
                  onChange={(e) => setNickname(e.target.value)}
                  placeholder="เช่น น้องฟ้าใส, ปอนด์, บีม..."
                  maxLength={24}
                  className="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-sky-500 focus:ring-4 focus:ring-sky-100 text-sm font-medium outline-hidden bg-slate-50/50"
                />
                {error && <p className="text-xs text-rose-500 mt-1 font-medium">{error}</p>}
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1.5">ระดับชั้น</label>
                <div className="grid grid-cols-3 gap-2">
                  {['ม.4', 'ม.5', 'ม.6'].map(g => (
                    <button
                      key={g}
                      type="button"
                      onClick={() => setGrade(g)}
                      className={`py-2 rounded-xl text-xs font-bold border transition cursor-pointer ${
                        grade === g ? 'bg-sky-600 text-white border-sky-600 shadow-xs' : 'bg-slate-50 text-slate-600 border-slate-200'
                      }`}
                    >
                      {g}
                    </button>
                  ))}
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-2">
                  เลือกโซนที่นั่งของน้อง (โซน 1 - 4) <span className="text-rose-500">*</span>
                </label>
                <div className="grid grid-cols-2 gap-2.5">
                  {ZONES.map(z => {
                    const isSelected = selectedZone === z.id;
                    return (
                      <button
                        key={z.id}
                        type="button"
                        onClick={() => setSelectedZone(z.id)}
                        className={`p-3 rounded-2xl border-2 text-left transition flex flex-col justify-between cursor-pointer ${
                          isSelected 
                            ? `${z.colorClass} ring-2 ring-sky-400/50 shadow-sm font-bold` 
                            : 'border-slate-200 bg-white hover:border-slate-300 text-slate-700'
                        }`}
                      >
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-bold">{z.badge}</span>
                          {isSelected && <span className="text-xs text-sky-600">✓</span>}
                        </div>
                        <div className="text-[11px] mt-1 text-slate-500 leading-tight">
                          {z.situationNumber}
                        </div>
                      </button>
                    );
                  })}
                </div>
              </div>

              <div className="space-y-2 pt-1">
                <button
                  type="submit"
                  className="w-full py-3.5 rounded-2xl font-heading font-bold text-base text-white bg-gradient-to-r from-sky-600 via-indigo-600 to-purple-600 hover:from-sky-700 shadow-md shadow-sky-200 active:scale-95 transition cursor-pointer"
                >
                  ต่อไป: ทำใบงาน KWL 📋
                </button>
                <button
                  type="button"
                  onClick={() => setStep(0)}
                  className="w-full py-2.5 rounded-xl text-xs font-semibold text-slate-500 hover:text-slate-700 hover:bg-slate-100 transition cursor-pointer"
                >
                  ← ย้อนกลับไปเปลี่ยนรหัสห้องเรียน (ห้องปัจจุบัน: {activeSession.code})
                </button>
              </div>
            </form>
          </div>
        );
      }

      // STEP 2: ENHANCED KWL FORM WITH INTERACTIVE CHECKLISTS
      return (
        <div className="glass-card rounded-3xl p-5 sm:p-7 border-2 border-purple-200 bg-white shadow-lg view-transition">
          <div className="text-center mb-5">
            <span className="inline-block px-3 py-1 rounded-full text-xs font-bold bg-purple-100 text-purple-800 mb-1">
              ใบงาน The Teaching Profession
            </span>
            <h3 className="text-xl sm:text-2xl font-heading font-extrabold text-slate-900 leading-tight">
              📋 แบบสำรวจ KWL ก่อนเริ่มกิจกรรม
            </h3>
            <p className="text-xs text-slate-500 mt-1">
              คลิกเลือกข้อความตัวอย่างที่ตรงใจ หรือพิมพ์ตอบเองได้เลยนะจ๊ะ!
            </p>
          </div>

          {error && <p className="text-xs text-rose-500 mb-3 font-medium text-center">{error}</p>}

          <form onSubmit={handleKwlSubmit} className="space-y-4">
            {/* Field 1: What I Know */}
            <div className="p-4 rounded-2xl border-2 border-amber-300 bg-amber-50/50 space-y-2">
              <label className="block text-sm font-bold text-amber-950 flex items-center gap-1.5">
                <span>💡</span>
                <span>K - What I Know (สิ่งที่น้องรู้อยู่แล้วเกี่ยวกับครู)</span>
              </label>

              <div className="space-y-1.5 pt-1">
                <span className="text-[11px] font-semibold text-slate-600 block">กดเลือกข้อที่ตรงใจได้เลย:</span>
                <div className="flex flex-wrap gap-1.5">
                  {KWL_K_CHIPS.map(chip => {
                    const isSelected = selectedKChips.includes(chip);
                    return (
                      <button
                        key={chip}
                        type="button"
                        onClick={() => toggleKChip(chip)}
                        className={`px-2.5 py-1.5 rounded-xl text-xs font-medium text-left transition border cursor-pointer ${
                          isSelected 
                            ? 'bg-amber-500 text-slate-950 border-amber-600 font-bold shadow-xs' 
                            : 'bg-white text-slate-700 border-amber-200 hover:bg-amber-100/60'
                        }`}
                      >
                        {isSelected ? '✓ ' : '+ '}{chip}
                      </button>
                    );
                  })}
                </div>
              </div>

              <textarea
                value={whatIKnowCustom}
                onChange={e => setWhatIKnowCustom(e.target.value)}
                placeholder="หรือพิมพ์ความคิดเห็นเพิ่มเติมด้วยตัวเอง..."
                rows={2}
                className="w-full p-2.5 rounded-xl border border-amber-300 text-xs outline-hidden bg-white resize-none mt-2"
              ></textarea>
            </div>

            {/* Field 2: What I Want to Know */}
            <div className="p-4 rounded-2xl border-2 border-sky-300 bg-sky-50/50 space-y-2">
              <label className="block text-sm font-bold text-sky-950 flex items-center gap-1.5">
                <span>🎯</span>
                <span>W - What I Want to Know (สิ่งที่อยากรู้จากค่ายนี้)</span>
              </label>

              <div className="space-y-1.5 pt-1">
                <span className="text-[11px] font-semibold text-slate-600 block">กดเลือกข้อที่อยากรู้:</span>
                <div className="flex flex-wrap gap-1.5">
                  {KWL_W_CHIPS.map(chip => {
                    const isSelected = selectedWChips.includes(chip);
                    return (
                      <button
                        key={chip}
                        type="button"
                        onClick={() => toggleWChip(chip)}
                        className={`px-2.5 py-1.5 rounded-xl text-xs font-medium text-left transition border cursor-pointer ${
                          isSelected 
                            ? 'bg-sky-500 text-white border-sky-600 font-bold shadow-xs' 
                            : 'bg-white text-slate-700 border-sky-200 hover:bg-sky-100/60'
                        }`}
                      >
                        {isSelected ? '✓ ' : '+ '}{chip}
                      </button>
                    );
                  })}
                </div>
              </div>

              <textarea
                value={whatIWantToKnowCustom}
                onChange={e => setWhatIWantToKnowCustom(e.target.value)}
                placeholder="หรือพิมพ์สิ่งที่อยากรู้เพิ่มเติม..."
                rows={2}
                className="w-full p-2.5 rounded-xl border border-sky-300 text-xs outline-hidden bg-white resize-none mt-2"
              ></textarea>
            </div>

            {/* Field 3: What I Have Learned - LOCKED 🔒 */}
            <div className="p-4 rounded-2xl border-2 border-slate-200 bg-slate-100 opacity-80 cursor-not-allowed">
              <div className="flex items-center justify-between mb-1">
                <label className="text-sm font-bold text-slate-500 flex items-center gap-1.5">
                  <span>🌱</span>
                  <span>L - What I Have Learned (สิ่งที่ได้เรียนรู้)</span>
                </label>
                <span className="text-[11px] font-bold text-purple-700 bg-purple-100 px-2 py-0.5 rounded-full">
                  🔒 ล็อคไว้
                </span>
              </div>
              <p className="text-xs text-slate-500 pt-1 leading-relaxed">
                ช่องนี้จะปลดล็อคให้อัตโนมัติหลังน้องทำกิจกรรม Lesson Plan Studio เสร็จ เพื่อสรุปและสะท้อนคิด (Reflection) ปิดค่าย
              </p>
            </div>

            <div className="flex items-center gap-2 pt-2">
              <button
                type="button"
                onClick={() => setStep(1)}
                className="px-4 py-3 rounded-2xl text-xs font-bold text-slate-600 bg-slate-100 cursor-pointer"
              >
                ย้อนกลับ
              </button>
              <button
                type="submit"
                className="flex-1 py-3.5 rounded-2xl font-heading font-bold text-sm text-white bg-gradient-to-r from-purple-600 via-indigo-600 to-sky-600 hover:from-purple-700 shadow-md transition cursor-pointer"
              >
                บันทึกและเข้าร่วมห้องเรียน 🚀
              </button>
            </div>
          </form>
        </div>
      );
    }

    // --- Student Phase 1: What is a teacher? ---
    function StudentPhase1({ db, currentStudent }) {
      const { appState, schoolPollVotes } = db;
      const step = appState.phase_1_step || 1;
      const currentModel = appState.phase_1_model || 'sage';

      const [text, setText] = useState('');
      const [toast, setToast] = useState('');

      const myPollVote = schoolPollVotes.find(v => v.student_id === currentStudent?.id);

      const handleOpenSubmit = (e) => {
        e.preventDefault();
        if (!text.trim()) return;
        db.submitPhase1Answer(text, 'open', currentStudent);
        setText('');
        setToast('ส่งขึ้นกระดานชอล์กเรียบร้อย! 🖍️');
        setTimeout(() => setToast(''), 2500);
      };

      const handleAdvDisSubmit = (isAdv) => {
        if (!text.trim()) return;
        const type = currentModel === 'sage' 
          ? (isAdv ? 'sage_adv' : 'sage_dis') 
          : (isAdv ? 'guide_adv' : 'guide_dis');

        db.submitPhase1Answer(text, type, currentStudent);
        setText('');
        setToast(isAdv ? 'ส่งเป็นข้อดีเรียบร้อย! 🟢' : 'ส่งเป็นข้อเสียเรียบร้อย! 🔴');
        setTimeout(() => setToast(''), 2500);
      };

      return (
        <div className="glass-card rounded-3xl p-5 sm:p-6 border-2 border-sky-200 bg-white shadow-lg view-transition">
          {toast && (
            <div className="mb-3 p-2.5 rounded-xl bg-slate-900 text-white text-xs font-bold text-center shadow-md animate-bounce-soft">
              {toast}
            </div>
          )}

          {/* STEP 1: OPEN QUESTION */}
          {step === 1 && (
            <div>
              <div className="text-center mb-4">
                <span className="inline-block px-3 py-1 rounded-full text-xs font-bold bg-sky-100 text-sky-800 mb-1">
                  What is a teacher ?
                </span>
                <h3 className="text-lg sm:text-xl font-heading font-extrabold text-slate-900 leading-tight">
                  ในมุมมองของน้องๆ "ครูคืออะไร?"
                </h3>
                <p className="text-xs text-slate-500 mt-1">
                  พิมพ์คำตอบของน้องเพื่อส่งขึ้นกระดานชอล์กของห้องเรียน!
                </p>
              </div>

              <form onSubmit={handleOpenSubmit} className="space-y-3">
                <textarea
                  value={text}
                  onChange={e => setText(e.target.value)}
                  placeholder="พิมพ์ความคิดเห็นของน้อง เช่น คนที่คอยชี้แนะ, ผู้เปิดโลกการเรียนรู้, แสงสว่างนำทาง..."
                  rows={3}
                  className="w-full px-4 py-3 rounded-2xl border-2 border-slate-200 focus:border-sky-500 text-sm font-medium outline-hidden bg-slate-50/50 resize-none"
                ></textarea>

                <button
                  type="submit"
                  className="w-full py-3.5 rounded-2xl font-heading font-bold text-sm text-white bg-gradient-to-r from-sky-600 to-indigo-600 hover:from-sky-700 shadow-md shadow-sky-200 active:scale-95 transition cursor-pointer"
                >
                  ส่งความคิดเห็นขึ้นกระดานชอล์ก 🖍️
                </button>
              </form>
            </div>
          )}

          {/* STEP 2: REVEAL 2 MODELS */}
          {step === 2 && (
            <div className="space-y-4 text-center view-transition">
              <span className="inline-block px-3 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-900">
                เฉลย 2 รูปแบบบทบาทครู
              </span>
              <h3 className="text-lg font-heading font-extrabold text-slate-900">
                คุณครูในทางทฤษฎีมี 2 แบบหลัก:
              </h3>

              <div className="space-y-3 text-left">

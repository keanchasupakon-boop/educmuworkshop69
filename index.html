    // --- Student Phase 4: Finale, 9:16 Story Card & PNG Download (Fix #5) ---
    function StudentPhase4({ db, currentStudent, onLeaveClassroom }) {
      const { appState, updateStudentKwl, submitWordCloud } = db;
      const step = appState.phase_4_step || 1;
      const currentCategory = appState.word_cloud_category || 'today';

      const [learnedText, setLearnedText] = useState(currentStudent?.kwl?.whatIHaveLearned || '');
      const [isLSubmitted, setIsLSubmitted] = useState(Boolean(currentStudent?.kwl?.whatIHaveLearned));

      const [w1, setW1] = useState('');
      const [w2, setW2] = useState('');
      const [w3, setW3] = useState('');
      const [isWordSubmitted, setIsWordSubmitted] = useState(false);
      const [toast, setToast] = useState('');
      const [isDownloading, setIsDownloading] = useState(false);

      const handleLSubmit = (e) => {
        e.preventDefault();
        if (!learnedText.trim()) return;
        updateStudentKwl(currentStudent.id, { whatIHaveLearned: learnedText.trim() });
        setIsLSubmitted(true);
        setToast('บันทึกบทเรียน KWL เรียบร้อย! 🎓');
        setTimeout(() => setToast(''), 2500);
      };

      const handleWordSubmit = (e) => {
        e.preventDefault();
        if (!w1.trim() && !w2.trim() && !w3.trim()) return;
        submitWordCloud(w1, w2, w3, currentCategory, currentStudent);
        setIsWordSubmitted(true);
        setToast('ส่งคำตอบขึ้นเมฆคำศัพท์แล้ว! ☁️');
        setTimeout(() => setToast(''), 2500);
      };

      // Download 9:16 Story Card as PNG using html2canvas (Fix #5)
      const handleDownloadCard = () => {
        const cardEl = document.getElementById('digitalKeepsakeStoryCard');
        if (!cardEl) return;
        if (!window.html2canvas) {
          alert('กำลังดาวน์โหลดโปรแกรมสร้างรูปภาพ กรุณาลองใหม่อีกครั้ง');
          return;
        }

        setIsDownloading(true);
        window.html2canvas(cardEl, {
          scale: 2.5,
          useCORS: true,
          backgroundColor: '#090d16'
        }).then(canvas => {
          const link = document.createElement('a');
          link.download = `CMU69_StoryCard_${currentStudent?.name || 'student'}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
          setIsDownloading(false);
          setToast('ดาวน์โหลดรูปภาพ 9:16 เรียบร้อย! 📸');
          setTimeout(() => setToast(''), 2500);
        }).catch(err => {
          console.error(err);
          setIsDownloading(false);
          alert('ไม่สามารถบันทึกเป็นรูปภาพได้ในเบราว์เซอร์นี้ กรุณาแคปหน้าจอแทนนะครับ');
        });
      };

      return (
        <div className="space-y-5 view-transition">
          {toast && (
            <div className="p-2.5 rounded-xl bg-purple-900 text-white text-xs font-bold text-center shadow-md animate-bounce-soft">
              {toast}
            </div>
          )}

          {/* STEP 1: KWL UNLOCKED L & PAUSE SCREEN */}
          {step === 1 && (
            <div className="glass-card rounded-3xl p-5 sm:p-6 border-2 border-purple-200 bg-white shadow-md space-y-4">
              <div className="flex items-center justify-between">
                <h4 className="font-heading font-bold text-sm sm:text-base text-purple-900 flex items-center gap-1.5">
                  <span>🌱 สะท้อนคิด KWL: ช่อง L ปลดล็อคแล้ว!</span>
                </h4>
                <span className="text-[10px] px-2 py-0.5 rounded-full font-bold bg-emerald-100 text-emerald-800">
                  🔓 ปลดล็อคแล้ว
                </span>
              </div>

              <div className="space-y-2 text-xs bg-purple-50/60 p-3 rounded-2xl border border-purple-100">
                <p><strong className="text-amber-800">K (ที่เคยตอบ):</strong> {currentStudent?.kwl?.whatIKnow || '-'}</p>
                <p><strong className="text-sky-800">W (ที่เคยตอบ):</strong> {currentStudent?.kwl?.whatIWantToKnow || '-'}</p>
              </div>

              {isLSubmitted ? (
                <div className="p-4 rounded-2xl bg-emerald-50 border border-emerald-200 text-center space-y-3">
                  <div className="w-12 h-12 mx-auto rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-2xl">
                    ✓
                  </div>
                  <div>
                    <h5 className="font-heading font-bold text-emerald-950 text-sm">
                      บันทึกบทเรียน KWL เรียบร้อยแล้ว!
                    </h5>
                    <p className="text-xs text-slate-600 mt-1 leading-relaxed">
                      "{learnedText}"
                    </p>
                  </div>

                  <div className="p-3 rounded-xl bg-white border border-emerald-200 text-xs text-slate-500">
                    <span className="animate-pulse">⏳ พี่วิทยากรกำลังตรวจดูภาพรวมการเรียนรู้ของทุกคน... รอสัญญาณสักครู่น้า</span>
                  </div>

                  <button onClick={() => setIsLSubmitted(false)} className="text-[11px] text-purple-700 underline pt-1 cursor-pointer">
                    แก้ไขคำตอบ L
                  </button>
                </div>
              ) : (
                <form onSubmit={handleLSubmit} className="space-y-3">
                  <label className="block text-xs font-bold text-purple-950">
                    L: What I Have Learned (วันนี้ได้เรียนรู้อะไรใหม่ๆ เกี่ยวกับวิชาชีพครูและการสอนบ้าง?) <span className="text-rose-500">*</span>
                  </label>
                  <textarea
                    value={learnedText}
                    onChange={e => setLearnedText(e.target.value)}
                    placeholder="เช่น เพิ่งรู้ว่าทั้ง 8 ข้อคืองานครูหมดเลย, การเขียนแผนการสอนให้ Active Learning ช่วยให้เด็กมีส่วนร่วม..."
                    rows={3}
                    className="w-full px-3.5 py-2.5 rounded-xl border border-purple-300 focus:border-purple-600 text-xs outline-hidden bg-white resize-none"
                  ></textarea>
                  <button
                    type="submit"
                    className="w-full py-3 rounded-2xl font-heading font-bold text-sm text-white bg-purple-600 hover:bg-purple-700 shadow-md transition cursor-pointer"
                  >
                    บันทึกช่อง L ให้ครบสมบูรณ์ ✨
                  </button>
                </form>
              )}
            </div>
          )}

          {/* STEP 2: MENTIMETER WORD CLOUD */}
          {step === 2 && (
            <div className="rounded-3xl p-5 sm:p-6 border-2 border-purple-500 bg-slate-900 text-white shadow-xl space-y-4">
              <div className="text-center">
                <span className="text-[10px] uppercase tracking-wider text-purple-400 font-bold">
                  Mentimeter-style Word Cloud
                </span>
                <h4 className="font-heading font-bold text-base sm:text-lg text-white mt-1">
                  {currentCategory === 'today' ? '☁️ 3 คำให้ค่ายวันนี้ (3 Words for Today)' : '☁️ 3 คำถึงพี่ๆ Staff (3 Words for Staff)'}
                </h4>
              </div>

              {isWordSubmitted ? (
                <div className="p-4 rounded-2xl bg-white/10 text-center text-xs space-y-2">
                  <p className="text-amber-300 font-bold">✓ คำตอบของน้องขึ้นเมฆคำศัพท์บนจอกลางแล้ว!</p>
                  <div className="flex justify-center gap-2">
                    <span className="px-2.5 py-1 rounded-xl bg-purple-500/40 text-purple-200 font-bold">{w1}</span>
                    <span className="px-2.5 py-1 rounded-xl bg-sky-500/40 text-sky-200 font-bold">{w2}</span>
                    <span className="px-2.5 py-1 rounded-xl bg-amber-500/40 text-amber-200 font-bold">{w3}</span>
                  </div>
                  <button onClick={() => setIsWordSubmitted(false)} className="text-[11px] text-purple-300 underline pt-1 cursor-pointer">
                    พิมพ์คำใหม่
                  </button>
                </div>
              ) : (
                <form onSubmit={handleWordSubmit} className="space-y-2.5">
                  <div className="grid grid-cols-3 gap-2">
                    <input
                      type="text"
                      placeholder="คำที่ 1"
                      value={w1}
                      onChange={e => setW1(e.target.value)}
                      maxLength={15}
                      className="px-2.5 py-2 rounded-xl bg-white/10 border border-white/20 text-xs text-white placeholder-slate-400 outline-hidden focus:border-purple-400 text-center"
                    />
                    <input
                      type="text"
                      placeholder="คำที่ 2"
                      value={w2}
                      onChange={e => setW2(e.target.value)}
                      maxLength={15}
                      className="px-2.5 py-2 rounded-xl bg-white/10 border border-white/20 text-xs text-white placeholder-slate-400 outline-hidden focus:border-purple-400 text-center"
                    />
                    <input
                      type="text"
                      placeholder="คำที่ 3"
                      value={w3}
                      onChange={e => setW3(e.target.value)}
                      maxLength={15}
                      className="px-2.5 py-2 rounded-xl bg-white/10 border border-white/20 text-xs text-white placeholder-slate-400 outline-hidden focus:border-purple-400 text-center"
                    />
                  </div>
                  <button
                    type="submit"
                    className="w-full py-3 rounded-2xl text-xs sm:text-sm font-bold text-slate-900 bg-amber-400 hover:bg-amber-300 shadow-md transition cursor-pointer"
                  >
                    ยิงคำขึ้น Word Cloud บนจอใหญ่ ☁️
                  </button>
                </form>
              )}
            </div>
          )}

          {/* STEP 3: FINALE & 9:16 DIGITAL STORY CARD DOWNLOAD (FIX #5) */}
          {step === 3 && (
            <div className="space-y-6 animate-cute-pop pb-6">
              <div className="p-6 rounded-3xl bg-gradient-to-tr from-amber-400 via-pink-500 to-purple-600 text-white text-center shadow-xl space-y-2">
                <span className="text-4xl block">🎓</span>
                <h3 className="text-xl sm:text-2xl font-heading font-black">
                  ยินดีด้วยนะ! จบค่ายแล้วจ้า
                </h3>
                <p className="text-xs text-amber-100">
                  คณะศึกษาศาสตร์ มหาวิทยาลัยเชียงใหม่
                </p>
              </div>

              {/* 9:16 VERTICAL STORY CARD CONTAINER (PERFECT FOR INSTAGRAM STORY / PORTFOLIO) */}
              <div className="flex flex-col items-center">
                <div 
                  id="digitalKeepsakeStoryCard"
                  className="w-[320px] h-[568px] sm:w-[350px] sm:h-[622px] rounded-3xl p-6 bg-gradient-to-b from-slate-950 via-purple-950 to-slate-950 border-4 border-amber-400 text-white flex flex-col justify-between shadow-2xl relative overflow-hidden select-none"
                  style={{ aspectRatio: '9 / 16' }}
                >
                  {/* Decorative Sparkles */}
                  <div className="absolute top-3 right-4 text-amber-300 text-lg opacity-80 animate-pulse">✨</div>
                  <div className="absolute bottom-4 left-4 text-amber-300 text-base opacity-70">🌟</div>

                  {/* Top: Header CMU Camp */}
                  <div className="text-center pt-2">
                    <span className="text-[10px] tracking-widest text-amber-400 font-extrabold uppercase bg-amber-400/10 px-3 py-1 rounded-full border border-amber-400/30">
                      FACULTY OF EDUCATION CMU 69
                    </span>
                    <h5 className="font-heading font-bold text-sm text-slate-200 mt-2">
                      The Teaching Profession Workshop
                    </h5>
                    <p className="text-[11px] text-purple-300 font-medium">ค้นพบตัวตน... สู่เส้นทางครูในฝัน</p>
                  </div>

                  {/* Middle: Student Profile */}
                  <div className="text-center my-auto space-y-3">
                    <div className="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-tr from-amber-400 to-pink-500 text-slate-950 flex items-center justify-center text-2xl font-bold shadow-lg">
                      🎒
                    </div>
                    <div>
                      <h4 className="font-heading font-extrabold text-xl text-white">
                        น้อง {currentStudent?.name}
                      </h4>
                      <p className="text-xs text-amber-300 font-medium mt-0.5">
                        {currentStudent?.grade || 'ม.6'} • {ZONES.find(z => z.id === currentStudent?.zone)?.badge}
                      </p>
                    </div>

                    {/* KWL Reflection Box */}
                    <div className="p-3.5 rounded-2xl bg-white/10 border border-white/20 text-left text-xs space-y-1">
                      <span className="text-[10px] text-amber-300 font-bold block uppercase">🌱 What I Have Learned:</span>
                      <p className="text-slate-200 line-clamp-3 italic leading-relaxed">
                        "{currentStudent?.kwl?.whatIHaveLearned || 'ได้เรียนรู้บทบาทหน้าที่ครูที่หลากหลายและเทคนิคการจัดการเรียนรู้'}"
                      </p>
                    </div>

                    {/* 3 Words Box */}
                    {(w1 || w2 || w3) && (
                      <div className="flex justify-center gap-1.5 flex-wrap">
                        {w1 && <span className="text-[10px] px-2 py-0.5 rounded-lg bg-purple-500/40 text-purple-200 font-bold border border-purple-400/40">{w1}</span>}
                        {w2 && <span className="text-[10px] px-2 py-0.5 rounded-lg bg-sky-500/40 text-sky-200 font-bold border border-sky-400/40">{w2}</span>}
                        {w3 && <span className="text-[10px] px-2 py-0.5 rounded-lg bg-amber-500/40 text-amber-200 font-bold border border-amber-400/40">{w3}</span>}
                      </div>
                    )}
                  </div>

                  {/* Bottom: Seniors' Blessing Quote */}
                  <div className="pt-3 border-t border-white/20 text-center space-y-1">
                    <p className="text-[10px] sm:text-[11px] text-amber-100 leading-snug line-clamp-3 italic opacity-90">
                      "ไม่ว่าสิ่งที่หวังจะใหญ่แค่ไหน ยากแค่ไหน เหนื่อยแค่ไหน ก็อยากให้รู้ไว้ว่า เราคนนี้จะไม่ยอมแพ้..."
                    </p>
                    <span className="text-[9px] text-amber-300 font-bold block">
                      — พี่ๆ ค่ายศึกษาศาสตร์ มช 69
                    </span>
                  </div>
                </div>

                {/* Actions: Download Image & Leave Room */}
                <div className="w-full max-w-xs space-y-2.5 mt-4">
                  <button
                    onClick={handleDownloadCard}
                    disabled={isDownloading}
                    className="w-full py-3.5 px-4 rounded-2xl font-heading font-bold text-sm text-slate-950 bg-amber-400 hover:bg-amber-300 shadow-xl transition flex items-center justify-center gap-2 cursor-pointer active:scale-95 disabled:opacity-50"
                  >
                    <span>📸</span>
                    <span>{isDownloading ? 'กำลังสร้างรูปภาพ...' : 'ดาวน์โหลดการ์ด (PNG 9:16)'}</span>
                  </button>

                  <button
                    onClick={onLeaveClassroom}
                    className="w-full py-2.5 px-4 rounded-xl text-xs font-semibold text-rose-600 bg-rose-50 hover:bg-rose-100 border border-rose-200 transition cursor-pointer"
                  >
                    🚪 ออกจากห้องเรียน / จบค่ายนี้
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // 8. ROOT APPLICATION
    // =========================================================================

    function App() {
      const urlParams = new URLSearchParams(window.location.search);
      const role = urlParams.get('role');
      const isAdmin = role === 'admin';
      const isPresenter = role === 'presenter';
      const db = useRealtimeClassroomDB();

      const [inPresentationMode, setInPresentationMode] = useState(isPresenter);

      return (
        <div className="min-h-screen flex flex-col">
          <TopNavigationBar
            isAdmin={isAdmin}
            isPresenter={inPresentationMode}
            currentPhase={db.appState.current_phase || 0}
            activeSession={db.activeSession}
            onTogglePresentation={() => setInPresentationMode(!inPresentationMode)}
            cloudStatus={db.cloudStatus}
          />

          <main className="flex-1">
            {inPresentationMode ? (
              <PresentationView
                db={db}
                onExitPresentation={() => setInPresentationMode(false)}
              />
            ) : isAdmin ? (
              <AdminView
                db={db}
                onEnterPresentation={() => setInPresentationMode(true)}
              />
            ) : (
              <StudentView db={db} />
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
